[project]
name = "unlimited-ocr-works"
version = "0.1.0"
description = "Compare AWS Textract, Unlimited-OCR, and PaddleOCR output with compact LLM-ready JSON and HTML reconstructions"
readme = "README.md"
authors = [
    { name = "bryanchanrgb", email = "bryanchanrgb@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.114",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
