[project]
name = "unlimited-ocr-works"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bryanchanrgb", email = "bryanchanrgb@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.114",
    "python-dotenv>=1.2.4",
]

[project.scripts]
